name: ai-investment-intelligence

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investment_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-non-local-use}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-investment_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:change-me-for-non-local-use@postgres:5432/investment_intelligence}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: INFO
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-alpha_vantage}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:-https://www.alphavantage.co/query}
      MARKET_CONTEXT_CACHE_TTL_SECONDS: ${MARKET_CONTEXT_CACHE_TTL_SECONDS:-300}
      MARKET_CONTEXT_PARTIAL_CACHE_TTL_SECONDS: ${MARKET_CONTEXT_PARTIAL_CACHE_TTL_SECONDS:-60}
      NEWS_PROVIDER: ${NEWS_PROVIDER:-alpha_vantage}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_BASE_URL: ${NEWS_BASE_URL:-https://www.alphavantage.co/query}
      NEWS_TIMEOUT_SECONDS: ${NEWS_TIMEOUT_SECONDS:-10}
      NEWS_MAX_RETRIES: ${NEWS_MAX_RETRIES:-2}
      NEWS_CACHE_TTL_SECONDS: ${NEWS_CACHE_TTL_SECONDS:-900}
      NEWS_EMPTY_CACHE_TTL_SECONDS: ${NEWS_EMPTY_CACHE_TTL_SECONDS:-300}
      NEWS_FRESH_HOURS: ${NEWS_FRESH_HOURS:-6}
      NEWS_RECENT_HOURS: ${NEWS_RECENT_HOURS:-24}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
